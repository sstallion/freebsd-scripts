- name: Checking Boot Method
  ansible.builtin.command: sysctl -n machdep.bootmethod
  register: sysctl_bootmethod
  changed_when: false
  failed_when: false

- name: Checking Disks
  ansible.builtin.find:
    patterns:
      - '^a?da\d+$'
    paths: /dev/
    file_type: any
    use_regex: true
  register: find_disks

- name: Checking Jailed
  ansible.builtin.command: sysctl -n security.jail.jailed
  register: sysctl_jailed
  changed_when: false
  failed_when: false

- name: Checking Jails
  ansible.builtin.command: jls name
  register: jls_names
  changed_when: false
  failed_when: false

- name: Checking Packages
  ansible.builtin.command: pkg -N
  register: pkg
  changed_when: false
  failed_when: false

- name: Checking Base Packages
  ansible.builtin.command: pkg -N info FreeBSD-runtime
  register: pkgbase
  changed_when: false
  failed_when: false

- name: Checking Ports
  ansible.builtin.command: stat -q /usr/ports
  register: ports
  changed_when: false
  failed_when: false

- name: Checking Scripts
  ansible.builtin.command: stat -q /var/scripts
  register: scripts
  changed_when: false
  failed_when: false

- name: Checking Security
  ansible.builtin.command: sysctl -n kern.securelevel
  register: sysctl_securelevel
  changed_when: false
  failed_when: false

- name: Checking VM Guest
  ansible.builtin.command: sysctl -n kern.vm_guest
  register: sysctl_vm_guest
  changed_when: false
  failed_when: false

- name: Checking VNET
  ansible.builtin.command: sysctl -n security.jail.vnet
  register: sysctl_vnet
  changed_when: false
  failed_when: false

- name: Checking ZFS
  ansible.builtin.command: kldstat -q -m zfs
  register: kldstat_zfs
  changed_when: false
  failed_when: false

- name: Setting Facts
  ansible.builtin.set_fact:
    disks: '{{ find_disks.files }}'
    has_disks: '{{ find_disks.files | length > 0 }}'
    has_pkg: '{{ pkg.rc == 0 }}'
    has_pkgbase: '{{ pkgbase.rc == 0 }}'
    has_ports: '{{ ports.rc == 0 }}'
    has_scripts: '{{ scripts.rc == 0 }}'
    has_zfs: '{{ kldstat_zfs.rc == 0 }}'
    is_guest: '{{ sysctl_vm_guest.stdout != "none" }}'
    is_jail: '{{ sysctl_jailed.stdout == "1" }}'
    is_secure: '{{ sysctl_securelevel.stdout | int > 0 }}'
    is_uefi: '{{ sysctl_bootmethod.stdout == "UEFI" }}'
    is_vnet: '{{ sysctl_vnet.stdout == "1" }}'
    jails: '{{ jls_names.stdout.split() }}'
    cacheable: true

- name: Checking Host Compatibility
  ansible.builtin.fail:
    msg: 'Incompatible host configuration; is this a jail?'
  when: >
    requires_host | default(false) and is_jail or
    requires_jail | default(false) and not is_jail or
    requires_vnet | default(false) and not is_vnet

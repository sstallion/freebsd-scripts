- name: Configuring periodic.conf
  community.general.sysrc:
    name: '{{ item.name }}'
    value: '{{ item.value }}'
    path: /etc/periodic.conf
  with_items:
    - { name: daily_show_success, value: 'NO' }
    - { name: daily_show_info, value: 'NO' }
    - { name: daily_status_security_inline, value: 'YES' }
    - { name: weekly_show_success, value: 'NO' }
    - { name: weekly_show_info, value: 'NO' }
    - { name: weekly_status_security_inline, value: 'YES' }
    - { name: monthly_show_success, value: 'NO' }
    - { name: monthly_show_info, value: 'NO' }
    - { name: monthly_status_security_inline, value: 'YES' }
    - { name: security_show_success, value: 'NO' }
    - { name: security_show_info, value: 'NO' }
    # Packages are not updated regularly enough on the quarterly branch to
    # make pkgaudit useful when daily_pkg_update_enable is enabled.
    - { name: security_status_pkgaudit_enable, value: 'NO' }
  notify:
    - sort periodic.conf

- name: Configuring Periodic Scripts
  block:
    - name: Configuring 900.pkg-update
      block:
        - name: Installing 900.pkg-update
          ansible.builtin.copy:
            src: files/periodic/daily/900.pkg-update
            dest: /usr/local/etc/periodic/daily/
            mode: '0755'
        - name: Enabling 900.pkg-update
          community.general.sysrc:
            name: daily_pkg_update_enable
            value: 'YES'
            path: /etc/periodic.conf
          notify:
            - sort periodic.conf

    - name: Configuring 900.ports-update
      when: has_ports
      block:
        - name: Installing 900.ports-update
          ansible.builtin.copy:
            src: files/periodic/daily/900.ports-update
            dest: /usr/local/etc/periodic/daily/
            mode: '0755'
        - name: Enabling 900.ports-update
          community.general.sysrc:
            name: daily_ports_update_enable
            value: 'YES'
            path: /etc/periodic.conf
          notify:
            - sort periodic.conf

    - name: Configuring 900.scripts-update
      when: has_scripts and not is_jail
      block:
        - name: Installing 900.scripts-update
          ansible.builtin.copy:
            src: files/periodic/daily/900.scripts-update
            dest: /usr/local/etc/periodic/daily/
            mode: '0755'
        - name: Enabling 900.scripts-update
          community.general.sysrc:
            name: daily_scripts_update_enable
            value: 'YES'
            path: /etc/periodic.conf
          notify:
            - sort periodic.conf

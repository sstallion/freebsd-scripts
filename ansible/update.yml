- name: Updating Host
  hosts: all
  roles:
    - common
  vars:
    ports_repo: https://git.FreeBSD.org/ports.git
    requires_host: true
    uefi_loader:
      amd64: bootx64.efi
      arm64: bootaa64.efi
  tasks:
    - name: Updating Packages
      notify:
        - pkg clean
      block:
        - name: Updating Packages
          community.general.pkgng:
            name: '*'
            state: latest
            autoremove: true

        - name: Updating Jail Packages
          community.general.pkgng:
            name: '*'
            state: latest
            autoremove: true
            jail: '{{ item }}'
          with_items: '{{ jails }}'

    - name: Updating Ports
      notify:
        - make index
      when: has_ports
      block:
        - name: Checking INDEX
          ansible.builtin.find:
            path: /usr/ports/
            patterns: INDEX-*
          register: ports_index
          changed_when: false

        - name: Checking Current Branch
          ansible.builtin.command: git -C /usr/ports rev-parse --abbrev-ref HEAD # noqa: command-instead-of-module
          register: ports_branch
          changed_when: false

        - name: Checking Latest Branch
          ansible.builtin.shell: |
            set -o pipefail
            git ls-remote --heads --sort=-v:refname {{ ports_repo }} "20[0-9][0-9]Q[1-4]" | head -n 1 | cut -f 3 -d /
          register: ports_latest
          changed_when: false

        - name: Pulling Changes
          ansible.builtin.command: git -C /usr/ports pull --ff-only # noqa: command-instead-of-module
          register: ports_pull
          changed_when: "'Already up to date.' not in ports_pull.stdout"

        - name: Switching to Latest Branch
          ansible.builtin.shell: |
            set -o errexit
            git -C /usr/ports fetch origin {{ ports_latest.stdout }}:{{ ports_latest.stdout }}
            git -C /usr/ports branch --set-upstream-to=origin/{{ ports_latest.stdout }}
          changed_when: true
          when: ports_branch.stdout != ports_latest.stdout

    - name: Updating FreeBSD
      notify:
        - reboot
      when: not is_pkgbase
      block:
        - name: Fetching FreeBSD Updates
          ansible.builtin.command: freebsd-update --not-running-from-cron fetch
          register: freebsd_update_fetch
          changed_when: false

        - name: Checking FreeBSD Updates
          ansible.builtin.set_fact:
            freebsd_update: "{{ 'No updates needed to update system' not in freebsd_update_fetch.stdout_lines }}"
          changed_when: false

        - name: Fetching FreeBSD Jail Updates
          ansible.builtin.command: freebsd-update -j {{ item }} --not-running-from-cron fetch
          register: freebsd_update_jails_fetch
          changed_when: false
          with_items: '{{ jails }}'

        - name: Checking FreeBSD Jail Updates
          ansible.builtin.set_fact:
            freebsd_update_jails: >-
              {{ freebsd_update_jails_fetch.results | rejectattr('stdout_lines', 'search', 'No updates needed to update system') |
                   map(attribute='item') | list }}
          changed_when: false

        - name: Checking Security
          ansible.builtin.set_fact:
            freebsd_update_secure: '{{ is_secure and (freebsd_update or freebsd_update_jails | length > 0) }}'
          changed_when: false

        - name: Lowering Security
          ansible.builtin.command: sysrc kern_securelevel_enable="NO"
          changed_when: true
          when: freebsd_update_secure

        - name: Rebooting Host
          ansible.builtin.reboot:
          when: freebsd_update_secure

        - name: Updating FreeBSD
          ansible.builtin.command: freebsd-update --not-running-from-cron install
          register: freebsd_update_install
          changed_when: true
          when: freebsd_update

        - name: Updating FreeBSD Jails
          ansible.builtin.command: freebsd-update -j {{ item }} --not-running-from-cron install
          changed_when: true
          with_items: '{{ freebsd_update_jails }}'

        - name: Raising Security
          ansible.builtin.command: sysrc kern_securelevel_enable="YES"
          changed_when: true
          when: freebsd_update_secure
  handlers:
    - name: Updating INDEX
      ansible.builtin.command: make -C /usr/ports index
      changed_when: true
      when: ports_index.files | length > 0
      listen: make index

    - name: Updating Boot Loader
      ansible.builtin.copy:
        src: /boot/loader.efi
        dest: '/boot/efi/{{ item }}'
        mode: preserve # msdosfs
        remote_src: true
      with_items:
        - efi/boot/{{ uefi_loader[ansible_facts['architecture']] }}
        - efi/freebsd/loader.efi
      when: "is_uefi and '/boot/loader.efi' in freebsd_update_install.stdout_lines"
      listen: reboot

    - name: Rebooting Host
      ansible.builtin.reboot:
      listen: reboot
